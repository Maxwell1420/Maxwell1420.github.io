<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake – NEONHALLE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:         #150F2B;
    --surface:    #1C1440;
    --surface-2:  #241A4E;
    --line:       #362A66;
    --text:       #F5F3FF;
    --text-muted: #A79FD1;
    --text-faint: #7A73A8;
    --yellow:     #FFD23F;
    --pink:       #FF5D8F;
    --teal:       #2FE6B8;
    --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }

  *, *::before, *::after{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0;
    height:100%;
  }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(139,124,246,0.14), transparent 42%),
      radial-gradient(circle at 90% 85%, rgba(255,93,143,0.10), transparent 38%);
    color: var(--text);
    font-family: var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  button{ font-family: inherit; }
  :focus-visible{ outline: 3px solid var(--yellow); outline-offset: 2px; border-radius: 6px; }

  .game-card{
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 20px 20px 24px;
    box-shadow: 0 24px 60px -24px rgba(8,5,25,0.7);
  }

  .title-row{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .btn-icon{
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text-muted);
    font-size: 0.95rem;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex: 0 0 auto;
  }
  .btn-icon[hidden]{ display:none; }

  #app{ width:100%; display:flex; align-items:center; justify-content:center; }
  #app:fullscreen,
  #app:-webkit-full-screen{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(139,124,246,0.14), transparent 42%),
      radial-gradient(circle at 90% 85%, rgba(255,93,143,0.10), transparent 38%);
    padding: 20px;
  }
  #app:fullscreen .game-card,
  #app:-webkit-full-screen .game-card{
    max-width: 560px;
  }
  .title-row h1{
    margin:0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.5rem;
    letter-spacing: -0.01em;
  }
  .title-row h1 em{
    font-style: normal;
    color: var(--teal);
  }
  .title-row p{
    margin: 2px 0 0;
    font-size: 0.8rem;
    color: var(--text-faint);
  }

  .score-row{
    display:flex;
    gap: 10px;
    margin-top: 16px;
  }
  .score-box{
    flex:1;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    text-align:center;
  }
  .score-box span{
    display:block;
    font-size: 0.7rem;
    color: var(--text-faint);
    text-transform: none;
  }
  .score-box b{
    display:block;
    font-family: var(--font-display);
    font-size: 1.4rem;
    margin-top: 2px;
  }
  #scoreValue{ color: var(--yellow); }
  #highscoreValue{ color: var(--teal); }

  .canvas-wrap{
    position: relative;
    margin-top: 16px;
    border-radius: 14px;
    overflow: hidden;
    background: #0F0A24;
    border: 1px solid var(--line);
    aspect-ratio: 1 / 1;
  }
  canvas{
    display:block;
    width: 100%;
    height: 100%;
  }

  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 12px;
    background: rgba(15,10,36,0.86);
    backdrop-filter: blur(2px);
    text-align:center;
    padding: 24px;
  }
  .overlay[hidden]{ display:none; }
  .overlay .icon{ font-size: 2.2rem; }
  .overlay h2{
    margin:0;
    font-family: var(--font-display);
    font-size: 1.25rem;
  }
  .overlay p{
    margin:0;
    color: var(--text-muted);
    font-size: 0.88rem;
    max-width: 26ch;
  }
  .overlay .badge{
    background: rgba(255,210,63,0.14);
    color: var(--yellow);
    border: 1px solid rgba(255,210,63,0.4);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 700;
  }

  .btn{
    border: none;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.92rem;
    padding: 11px 24px;
    border-radius: 999px;
    background: var(--yellow);
    color: #1B1305;
    transition: transform 0.15s ease;
  }
  .btn:hover{ transform: translateY(-1px); }
  .btn:active{ transform: translateY(0); }
  .btn-ghost{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-muted);
  }

  .controls-hint{
    margin-top: 14px;
    text-align:center;
    font-size: 0.78rem;
    color: var(--text-faint);
  }
  .controls-hint kbd{
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 6px;
    font-family: var(--font-body);
    font-size: 0.75rem;
  }

  .dpad{
    margin: 18px auto 0;
    display:grid;
    grid-template-columns: repeat(3, 54px);
    grid-template-rows: repeat(3, 54px);
    gap: 6px;
    justify-content:center;
  }
  .dpad button{
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 12px;
    font-size: 1.2rem;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action: manipulation;
  }
  .dpad button:active{ background: var(--pink); border-color: var(--pink); }
  .dpad-up{ grid-column: 2; grid-row: 1; }
  .dpad-left{ grid-column: 1; grid-row: 2; }
  .dpad-pause{ grid-column: 2; grid-row: 2; font-size: 1rem; }
  .dpad-right{ grid-column: 3; grid-row: 2; }
  .dpad-down{ grid-column: 2; grid-row: 3; }

  @media (min-width: 640px){
    .dpad{ display: none; }
  }
  @media (prefers-reduced-motion: reduce){
    .btn, .dpad button{ transition: none; }
  }
</style>
</head>
<body>

<div id="app">
<div class="game-card">
  <div class="title-row">
    <div>
      <h1>NEON <em>SNAKE</em></h1>
      <p>Klassisches Snake im NEONHALLE-Look</p>
    </div>
    <button class="btn-icon" id="fullscreenBtn" aria-label="Vollbild" hidden>⛶</button>
  </div>

  <div class="score-row">
    <div class="score-box"><span>Punkte</span><b id="scoreValue">0</b></div>
    <div class="score-box"><span>Highscore</span><b id="highscoreValue">0</b></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="gameCanvas"></canvas>

    <div class="overlay" id="startOverlay">
      <div class="icon">🐍</div>
      <h2>Bereit?</h2>
      <p>Pfeiltasten, WASD oder die Buttons unten steuern die Schlange.</p>
      <button class="btn" id="startBtn">Spiel starten</button>
    </div>

    <div class="overlay" id="gameOverOverlay" hidden>
      <div class="icon">💥</div>
      <h2>Game Over</h2>
      <p id="finalScoreText">Punkte: 0</p>
      <span class="badge" id="newHighscoreBadge" hidden>Neuer Highscore!</span>
      <button class="btn" id="restartBtn">Nochmal spielen</button>
    </div>

    <div class="overlay" id="pauseOverlay" hidden>
      <div class="icon">⏸</div>
      <h2>Pause</h2>
      <button class="btn" id="resumeBtn">Weiter</button>
    </div>
  </div>

  <p class="controls-hint">
    <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> steuern · <kbd>Leertaste</kbd> pausiert
  </p>

  <div class="dpad" aria-label="Touch-Steuerung">
    <button class="dpad-up" data-dir="up" aria-label="Nach oben">▲</button>
    <button class="dpad-left" data-dir="left" aria-label="Nach links">◀</button>
    <button class="dpad-pause" id="dpadPause" aria-label="Pause">⏸</button>
    <button class="dpad-right" data-dir="right" aria-label="Nach rechts">▶</button>
    <button class="dpad-down" data-dir="down" aria-label="Nach unten">▼</button>
  </div>
</div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- Setup ---------------- */
  const GRID_SIZE = 20;
  const HIGHSCORE_KEY = 'neonhalle_snake_highscore';
  const START_SPEED_MS = 145;
  const MIN_SPEED_MS = 75;
  const SPEED_STEP_MS = 3;

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const scoreEl = document.getElementById('scoreValue');
  const highscoreEl = document.getElementById('highscoreValue');
  const startOverlay = document.getElementById('startOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const finalScoreText = document.getElementById('finalScoreText');
  const newHighscoreBadge = document.getElementById('newHighscoreBadge');

  let cellSize = 0;
  let snake, direction, nextDirection, food, score, speed, running, paused, loopHandle, lastTick;
  let highscore = parseInt(localStorage.getItem(HIGHSCORE_KEY) || '0', 10) || 0;
  highscoreEl.textContent = highscore;

  /* ---------------- Sizing ---------------- */
  function resizeCanvas(){
    const rect = canvas.parentElement.getBoundingClientRect();
    const size = Math.floor(rect.width);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cellSize = size / GRID_SIZE;
    if(snake) draw();
  }
  window.addEventListener('resize', resizeCanvas);

  /* ---------------- Game state ---------------- */
  function resetState(){
    const mid = Math.floor(GRID_SIZE / 2);
    snake = [
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
      { x: mid - 3, y: mid }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    speed = START_SPEED_MS;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood(){
    let candidate;
    do{
      candidate = {
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE)
      };
    } while(snake.some(s => s.x === candidate.x && s.y === candidate.y));
    food = candidate;
  }

  /* ---------------- Loop ---------------- */
  function startLoop(){
    lastTick = performance.now();
    loopHandle = requestAnimationFrame(tick);
  }

  function tick(now){
    if(!running) return;
    loopHandle = requestAnimationFrame(tick);
    if(paused) return;

    if(now - lastTick < speed) return;
    lastTick = now;

    step();
    draw();
  }

  function step(){
    direction = nextDirection;
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    const hitsWall = head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE;
    const hitsSelf = snake.some(s => s.x === head.x && s.y === head.y);

    if(hitsWall || hitsSelf){
      endGame();
      return;
    }

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y){
      score += 10;
      scoreEl.textContent = score;
      speed = Math.max(MIN_SPEED_MS, speed - SPEED_STEP_MS);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function endGame(){
    running = false;
    cancelAnimationFrame(loopHandle);

    const isNewHighscore = score > highscore;
    if(isNewHighscore){
      highscore = score;
      localStorage.setItem(HIGHSCORE_KEY, String(highscore));
      highscoreEl.textContent = highscore;
    }

    finalScoreText.textContent = 'Punkte: ' + score;
    newHighscoreBadge.hidden = !isNewHighscore;
    gameOverOverlay.hidden = false;
  }

  /* ---------------- Drawing ---------------- */
  function draw(){
    const size = GRID_SIZE * cellSize;
    ctx.clearRect(0, 0, size, size);

    // subtle grid
    ctx.strokeStyle = 'rgba(245,243,255,0.035)';
    ctx.lineWidth = 1;
    for(let i=1; i<GRID_SIZE; i++){
      ctx.beginPath();
      ctx.moveTo(i*cellSize, 0); ctx.lineTo(i*cellSize, size);
      ctx.moveTo(0, i*cellSize); ctx.lineTo(size, i*cellSize);
      ctx.stroke();
    }

    // food
    ctx.fillStyle = '#FF5D8F';
    const fp = 4;
    roundRect(food.x*cellSize+fp, food.y*cellSize+fp, cellSize-fp*2, cellSize-fp*2, 6);
    ctx.fill();

    // snake
    snake.forEach((seg, i)=>{
      const isHead = i === 0;
      ctx.fillStyle = isHead ? '#FFD23F' : 'rgba(47,230,184,' + (0.95 - i*0.02).toFixed(2) + ')';
      const p = isHead ? 1 : 2;
      roundRect(seg.x*cellSize+p, seg.y*cellSize+p, cellSize-p*2, cellSize-p*2, isHead ? 7 : 5);
      ctx.fill();
    });
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  /* ---------------- Controls ---------------- */
  function setDirection(dir){
    if(!running || paused) return;
    const map = {
      up:    { x: 0, y: -1 },
      down:  { x: 0, y: 1 },
      left:  { x: -1, y: 0 },
      right: { x: 1, y: 0 }
    };
    const d = map[dir];
    if(!d) return;
    // keine 180°-Wende auf sich selbst
    if(d.x === -direction.x && d.y === -direction.y) return;
    nextDirection = d;
  }

  const KEY_MAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  document.addEventListener('keydown', (e)=>{
    if(e.key === ' '){
      e.preventDefault();
      togglePause();
      return;
    }
    const dir = KEY_MAP[e.key];
    if(dir){
      e.preventDefault();
      setDirection(dir);
    }
  });

  document.querySelectorAll('.dpad button[data-dir]').forEach(btn=>{
    btn.addEventListener('click', ()=> setDirection(btn.dataset.dir));
  });

  // Swipe-Steuerung auf dem Spielfeld
  let touchStart = null;
  canvas.addEventListener('touchstart', (e)=>{
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', (e)=>{
    if(!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if(Math.abs(dx) > Math.abs(dy)){
      setDirection(dx > 0 ? 'right' : 'left');
    } else {
      setDirection(dy > 0 ? 'down' : 'up');
    }
    touchStart = null;
  }, { passive: true });

  /* ---------------- Pause ---------------- */
  function togglePause(){
    if(!running) return;
    paused = !paused;
    pauseOverlay.hidden = !paused;
    if(!paused) lastTick = performance.now();
  }
  document.getElementById('dpadPause').addEventListener('click', togglePause);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);

  /* ---------------- Start / Restart ---------------- */
  function beginGame(){
    resizeCanvas();
    resetState();
    running = true;
    paused = false;
    startOverlay.hidden = true;
    gameOverOverlay.hidden = true;
    pauseOverlay.hidden = true;
    draw();
    startLoop();
  }

  document.getElementById('startBtn').addEventListener('click', beginGame);
  document.getElementById('restartBtn').addEventListener('click', beginGame);

  /* ---------------- Vollbild ---------------- */
  const appEl = document.getElementById('app');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  function isFullscreen(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function updateFullscreenBtn(){
    const active = isFullscreen();
    fullscreenBtn.textContent = active ? '⤢' : '⛶';
    fullscreenBtn.setAttribute('aria-label', active ? 'Vollbild verlassen' : 'Vollbild');
  }
  function toggleFullscreen(){
    if(!isFullscreen()){
      const req = appEl.requestFullscreen || appEl.webkitRequestFullscreen;
      if(req) req.call(appEl).catch(()=>{});
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if(exit) exit.call(document);
    }
  }
  const fsSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  if(fsSupported){
    fullscreenBtn.hidden = false;
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateFullscreenBtn);
    document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);
  }
  window.addEventListener('fullscreenchange', resizeCanvas);
  window.addEventListener('webkitfullscreenchange', resizeCanvas);

  /* ---------------- Initial ---------------- */
  resizeCanvas();
})();
</script>

</body>
</html>
